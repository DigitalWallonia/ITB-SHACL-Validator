# Render IMAGE_DIGEST before server-side dry-run. Do not apply this template directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itb-shacl-validator
  namespace: pit
  labels:
    app.kubernetes.io/name: itb-shacl-validator
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: itb-shacl-validator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itb-shacl-validator
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-itb-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: validator
          image: IMAGE_DIGEST
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: '1'
              memory: 2Gi
              ephemeral-storage: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: validator-logs
              mountPath: /validator/logs
            - name: validator-tmp
              mountPath: /validator/tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: validator-logs
          emptyDir:
            sizeLimit: 256Mi
        - name: validator-tmp
          emptyDir:
            sizeLimit: 1Gi
