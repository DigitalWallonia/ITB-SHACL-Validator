name: Build test publish ITB validator
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: itb-validator-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify inputs
        env:
          JAVA_BASE: ${{ vars.ITB_JAVA_BASE_IMAGE }}
        run: |
          set -euo pipefail
          [[ "$JAVA_BASE" =~ ^eclipse-temurin:21-jre-jammy@sha256:[a-f0-9]{64}$ ]]
          echo '1c356d4cb79a7d30f1e71788f8cb7c2738f796a779d8a83e009040b21e848c4c  validator.jar' | sha256sum -c -
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and start both architectures
        env:
          JAVA_BASE: ${{ vars.ITB_JAVA_BASE_IMAGE }}
        run: |
          set -euo pipefail
          trap 'docker rm -f itb-test >/dev/null 2>&1 || true' EXIT
          for arch in amd64 arm64; do
            docker buildx build --platform linux/$arch --load --build-arg JAVA_BASE="$JAVA_BASE" --build-arg SOURCE_REVISION="$GITHUB_SHA" -t itb-test:$arch .
            docker run -d --platform linux/$arch --name itb-test --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --tmpfs /validator/tmp:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0770 --tmpfs /validator/logs:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0770 --cap-drop ALL --security-opt no-new-privileges --memory 2g -p 127.0.0.1:18096:8080 itb-test:$arch
            ready=false
            for i in $(seq 1 90); do
              code=$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:18096/ || true)
              if [[ "$code" =~ ^[234][0-9][0-9]$ ]]; then ready=true; break; fi
              sleep 2
            done
            docker logs --tail 100 itb-test
            test "$ready" = true
            docker rm -f itb-test
          done
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: published
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            JAVA_BASE=${{ vars.ITB_JAVA_BASE_IMAGE }}
            SOURCE_REVISION=${{ github.sha }}
      - name: Verify published image startup
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          set -euo pipefail
          trap 'docker rm -f itb-test >/dev/null 2>&1 || true' EXIT
          for arch in amd64 arm64; do
            docker pull --platform linux/$arch "$IMAGE@$DIGEST"
            docker run -d --platform linux/$arch --name itb-test --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --tmpfs /validator/tmp:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0770 --tmpfs /validator/logs:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0770 --cap-drop ALL --security-opt no-new-privileges --memory 2g -p 127.0.0.1:18096:8080 "$IMAGE@$DIGEST"
            ready=false
            for i in $(seq 1 90); do
              code=$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:18096/ || true)
              if [[ "$code" =~ ^[234][0-9][0-9]$ ]]; then ready=true; break; fi
              sleep 2
            done
            docker logs --tail 100 itb-test
            test "$ready" = true
            docker rm -f itb-test
          done
          echo "## Startup-verified image" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
